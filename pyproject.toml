[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vi-restore-llm"
version = "0.1.0"
description = "Small LLMs for Vietnamese diacritic restoration and typo correction, benchmarked against a TCN baseline and deployed on-device."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "psutil>=5.9"]

[project.optional-dependencies]
train = ["torch>=2.2", "transformers>=4.45", "peft>=0.12", "accelerate>=0.33", "bitsandbytes>=0.43; platform_system != 'Darwin'"]
gguf = ["llama-cpp-python>=0.2.90"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Larger character tagger: same recipe as tagger.yaml, about 2.6x the parameters, one more epoch.
output_dir: runs/ds-tagger-large
seed: 13

data:
  train: data/doc_split/train.jsonl
  dev: data/doc_split/dev.jsonl
  dev_limit: 5000
  min_char_count: 20

model:
  d_model: 512
  layers: 12
  heads: 8
  ff: 2048
  max_len: 384
  dropout: 0.1

train:
  batch_size: 256
  lr: 4.0e-4
  weight_decay: 0.01
  epochs: 4
  warmup_ratio: 0.02
  log_steps: 200
  eval_steps: 2000

# Word-boundary model trained on chunks (virestore.boundary) for input typed without spaces: same character
# Transformer as the tagger, two labels (a space follows / does not).
output_dir: runs/ds-boundary-span
seed: 13

data:
  train: data/doc_split/train.jsonl
  dev: data/doc_split/dev.jsonl
  dev_limit: 5000
  min_char_count: 20
  span_prob: 0.5     # half of the training rows are 1-8 consecutive words from anywhere in the sentence
  prefix_prob: 0.3   # then 30 % are cut at a random character: the user is still typing

model:
  d_model: 256
  layers: 6
  heads: 4
  ff: 1024
  max_len: 384
  dropout: 0.1

train:
  batch_size: 256
  lr: 5.0e-4
  weight_decay: 0.01
  epochs: 2
  warmup_ratio: 0.02
  log_steps: 200
  eval_steps: 2000

# Character-level diacritic tagger (virestore.tagger): Transformer encoder, one pass per sentence.
output_dir: runs/ds-tagger-s
seed: 13

data:
  train: data/doc_split/train.jsonl
  dev: data/doc_split/dev.jsonl
  dev_limit: 5000
  min_char_count: 20

model:
  d_model: 256
  layers: 6
  heads: 4
  ff: 1024
  max_len: 384
  dropout: 0.1

train:
  batch_size: 256
  lr: 5.0e-4
  weight_decay: 0.01
  epochs: 3
  warmup_ratio: 0.02
  log_steps: 200
  eval_steps: 2000
